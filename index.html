<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gasoline QR Scanner</title>
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #reader {
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>GASOLINE LOYALTY</h1>

  <p>Scan the customer's QR card.</p>

  <button onclick="startScanner()">
    📷 START SCANNER
  </button>

  <div id="reader"></div>

 <div id="result"></div>

<div id="purchaseArea" style="display:none;">
  <input id="litersPurchased" type="number" step="0.1" min="0.1" placeholder="Liters purchased">
  <button type="button" onclick="confirmTransaction()">CONFIRM TRANSACTION</button>
</div>

</div>

<script>

let scanner;

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxtqUqQCcSdykZ6fut7XXdZhhnjb6s7P5D2Dxg3FxiYbbr9hUVQzUawzVzn97cyj49-/exec";

function startScanner() {

  document.getElementById("result").innerText =
    "Starting camera...";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      document.getElementById("result").innerText =
        "Customer ID: " + decodedText + "\nChecking...";

      scanner.stop().then(function() {
  document.getElementById("reader").style.display = "block";
});
      const script = document.createElement("script");

      window.handleCustomer = function(data) {

    if (data) {
document.getElementById("purchaseArea").style.display = "block";
document.getElementById("purchaseArea").dataset.customerId = decodedText;
document.getElementById("litersPurchased").value = "";
          document.getElementById("result").innerText =
            "Customer found: " + data.name +
            "\nTotal Liters: " + data.totalLiters +
            "\nReward Progress: " + data.rewardProgress +
            "\nFree Liters: " + data.freeLiters;

        } else {

          document.getElementById("result").innerText =
            "Customer not found: " + decodedText;

        }

        script.remove();
        delete window.handleCustomer;
      };

      script.onerror = function() {

        document.getElementById("result").innerText =
          "Connection error. Please try again.";

        script.remove();
        delete window.handleCustomer;
      };

      script.src =
        APPS_SCRIPT_URL +
        "?customerId=" +
        encodeURIComponent(decodedText) +
        "&callback=handleCustomer";

      document.body.appendChild(script);

    },

    function(errorMessage) {
      // Normal scanning messages are ignored.
    }

  ).catch(function(error) {

    document.getElementById("result").innerText =
      "Camera error: " + error;

  });
}
function confirmTransaction() {
  
  const liters = Number(
    document.getElementById("litersPurchased").value
  );

  if (!liters || liters <= 0) {
    document.getElementById("result").innerText =
      "Please enter the liters purchased.";
    return;
  }

  const customerId =
    document.getElementById("purchaseArea").dataset.customerId;

  if (!customerId) {
    document.getElementById("result").innerText =
      "Customer ID is missing.";
    return;
  }

  document.getElementById("result").innerText =
    "Saving transaction...";

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=UTF-8"
    },
    body: JSON.stringify({
  customerId: customerId,
  liters: liters,
  transactionId: crypto.randomUUID()
    })
  })
  .then(function() {
    document.getElementById("result").innerText =
      "Transaction saved: " + liters + " L";
  })
  .catch(function(error) {
    document.getElementById("result").innerText =
      "Transaction error: " + error;
  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gasoline QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #reader {
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>GASOLINE LOYALTY</h1>

  <p>Scan the customer's QR card.</p>

  <button onclick="startScanner()">
    📷 START SCANNER
  </button>

  <div id="reader"></div>

  <div id="result"></div>

</div>

<script>

let scanner;

function startScanner() {

  document.getElementById("result").innerText =
    "Starting camera...";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

   function(decodedText) {

  document.getElementById("result").innerText =
    "Customer ID: " + decodedText + "\nSending...";

  scanner.stop();

  fetch("https://script.google.com/macros/s/AKfycbxtqUqQCcSdykZ6fut7XXdZhhnjb6s7P5D2Dxg3FxiYbbr9hUVQzUawzVzn97cyj49-/exec", {
    method: "POST",
    headers: {
      "Content-Type": "text/plain"
    },
    body: JSON.stringify({
      customerId: decodedText
    })
  })
  .then(response => response.json())
  .then(data => {

    if (data.success) {
      document.getElementById("result").innerText =
        "Customer found: " + decodedText;
    } else {
      document.getElementById("result").innerText =
        "Error: " + data.error;
    }

  })
  .catch(error => {

    document.getElementById("result").innerText =
      "Connection error: " + error;

  });

},

    function(errorMessage) {
      // Normal scanning messages are ignored.
    }

  ).catch(function(error) {

    document.getElementById("result").innerText =
      "Camera error: " + error;

  });
}

</script>

</body>
</html>
